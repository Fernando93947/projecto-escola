<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/form.css">
    <title>Passagem</title>
</head>
<body>
    <h1 class="principal">Compre já a sua passagem,e saiba quando viajar.</h1>
<!--FORMULÁRIO-->
    <div class="form">
        <form >
            <label>Nome</label><br>
            <input type="text" name="nome" id="nome"><br><br>
            <label>Nº de telefone</label><br>
            <input type="number" name="telefone" id="telefone"><br><br>
            <label>Endereço</label><br>
            <input type="text" name="endereco" id="endereco"><br><br>
            <label>Sexo</label><br>
            <label>Masculino</label>
            <input type="checkbox" name="masc" id="masc" checked>
            <label>Feminino</label>
            <input type="checkbox" name="fem" id="fem">
            <label>Outro</label>
            <input type="checkbox" name="out" id="out"><br><br>

            <select>
                <option>Selecione uma província</option>
                <option>Benguela</option>
                <option>Bié</option>
                <option>Huambo</option>
                <option>Uíge</option>
                <option>Zaire</option>
            </select><br><br>
            <div>
                Formas de pagamento.

            </div><br>
            <input id="btn"  type="button" value="PAGAR" onclick="">
        </form>
        <div id="res"></div>
    </div>


    <script src="js/formulario.js"></script>
</body>
</html>
